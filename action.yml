name: hexscope
description: Check files for what they give away — locations, serial numbers, authors, deleted text, black boxes that hide nothing — before they are published.
author: MykytaStel
branding:
  icon: eye
  color: blue

inputs:
  paths:
    description: Files or folders to check, separated by spaces. Folders are read through.
    default: "."
  fail-on:
    description: >-
      Fail when a file has any of these, comma-separated: reveals, hidden,
      damage, oddity, misnamed (a name that says another format than the
      file is), or kinds of fact such as location, serial, author, covered.
      "none" never fails.
    default: reveals,hidden,damage

runs:
  using: composite
  steps:
    # At a released version, the release's own build for this runner,
    # checked against its checksum and GitHub's signed record of the workflow
    # that built it; anywhere else, built from this action's own copy of the
    # repository (scripts/action-install.sh).
    - name: Get hexscope
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-install.sh" "$RUNNER_TEMP/hexscope"'
    - name: Check
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        CHECK_PATHS: ${{ inputs.paths }}
      # Paths are split on spaces on purpose: they are a list.
      run: '"$RUNNER_TEMP/hexscope/bin/hexscope" check --fail-on "$FAIL_ON" $CHECK_PATHS'
