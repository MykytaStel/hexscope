name: Dependency advisories

# Branch pushes are the source of truth for same-repository changes. Keep the
# pull_request checks for forks, whose pushes run in a different repository.
on:
  push:
    branches: ["**"]
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/package.json'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/package.json'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check Cargo.lock advisories
        run: cargo audit --file Cargo.lock

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Check pnpm-lock.yaml advisories
        run: pnpm audit --audit-level=low
