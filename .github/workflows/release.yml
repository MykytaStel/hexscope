name: Release binaries

# The command-line tool, built for the systems people and CI runners use and
# attached to each published release with a checksum and a signed record of
# where it was built: the GitHub Action downloads the one for its runner
# instead of compiling it, and anyone can use it without Rust.
on:
  release:
    types: [published]
  # A change to how they are built, or to the command itself, is built on
  # its pull request for every system, not attached.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - action.yml
      - scripts/action-install.sh
      - crates/hexscope-cli/**

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-26.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-26.04 }
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install && rustup target add "$TARGET"
        shell: bash
      # Linux builds are static (musl): one file that runs on any distribution.
      - if: contains(matrix.target, 'linux-musl')
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        shell: bash
        run: |
          if [[ "$TARGET" == *linux-musl ]]; then
            cross build --locked --release -p hexscope-cli --target "$TARGET"
          else
            cargo build --locked --release -p hexscope-cli --target "$TARGET"
          fi
      - name: Package
        id: package
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          name="hexscope-$version-$TARGET.tar.gz"
          exe=hexscope; [[ "$TARGET" == *windows* ]] && exe=hexscope.exe
          mkdir dist
          cp "target/$TARGET/release/$exe" LICENSE dist/
          tar -czf "$name" -C dist .
          if command -v sha256sum >/dev/null; then sha256sum "$name"; else shasum -a 256 "$name"; fi > "$name.sha256"
          if [[ "$TARGET" == *linux-musl ]]; then
            if [[ "$TARGET" == aarch64-unknown-linux-musl ]]; then
              python3 - "dist/$exe" <<'PY'
          import sys
          with open(sys.argv[1], "rb") as binary:
              header = binary.read(20)
          if header[:4] != b"\x7fELF" or len(header) < 20 or header[5] not in (1, 2):
              raise SystemExit("packaged ARM binary has an invalid ELF header")
          byteorder = "little" if header[5] == 1 else "big"
          if int.from_bytes(header[18:20], byteorder) != 183:
              raise SystemExit("packaged binary is not AArch64")
          print("packaged binary is AArch64 ELF")
          PY
            else
              ./dist/$exe --version
            fi
          else
            ./dist/$exe --version
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.name }}
      - if: github.event_name == 'release'
        name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.name }}" "${{ steps.package.outputs.name }}.sha256" --clobber

  # The Action as a workflow uses it, on each kind of runner: the build it
  # downloads, or, at a ref with none, the one it makes.
  action:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install
        shell: bash
      - name: Passes on what gives nothing away
        uses: ./
        with:
          paths: apps/web/public/samples/sample.png
