name: CI

# Every branch, not only main: a failure on main went unnoticed for days
# because all the work happened on branches that never triggered a run.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The runner image is named, not "latest": moving to a new Ubuntu is a
# change made and tested here, not one that arrives unannounced. Actions are
# pinned to a commit for the same reason, and because a tag can be moved;
# Dependabot proposes each new version as a pull request.

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # One version for the site, the CLI and the crates (docs/releasing.md):
      # the changelog must say what is in it.
      - name: Version and changelog agree
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "::notice::hexscope $version"
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      # What is merged but not released: a file a change (changes/README.md).
      - name: Unreleased changes are readable
        run: node scripts/changelog.mjs --check
      # Installs exactly the toolchain, components and targets that
      # rust-toolchain.toml pins, so CI and local builds cannot drift.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      # Large files within a time budget, in a release build: a long movie,
      # PDFs of ten thousand pages, archives and emails of thousands of parts.
      # A failure is work growing faster than the file.
      - name: Large files within budget
        run: cargo test --release -p hexscope-core --test big -- --nocapture
      - name: Builds for the browser target
        run: cargo check -p hexscope-core -p hexscope-wasm --target wasm32-unknown-unknown
      # `cargo install hexscope-cli` builds with whatever compiler the user
      # has: the published crates must build with their rust-version.
      - name: Builds with the oldest supported Rust
        run: |
          msrv=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked -p hexscope-cli -p hexscope-raster

  # The GitHub Action, run on the samples as a workflow would run it: a
  # photo that gives nothing away passes; the samples, which give plenty
  # away, fail.
  action:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Passes on what gives nothing away
        uses: ./
        with:
          paths: apps/web/public/samples/sample.png apps/web/public/samples/progressive.jpg
      - name: Fails on what does
        id: leaky
        continue-on-error: true
        uses: ./
        with:
          paths: apps/web/public/samples/photo.jpg
          fail-on: location
      - name: It did fail
        if: steps.leaky.outcome != 'failure'
        run: exit 1
      - name: Saved reports stay whole
        # In Actions the annotations go to standard error with --json and
        # --sarif, so what is saved from standard output is only the report.
        run: |
          bin="$RUNNER_TEMP/hexscope/bin/hexscope"
          set +e
          "$bin" check --sarif apps/web/public/samples/lease.odt > report.sarif
          sarif=$?
          "$bin" check --json apps/web/public/samples/lease.odt > report.jsonl
          json=$?
          set -e
          [ "$sarif" -eq 1 ] && [ "$json" -eq 1 ]
          python3 -c 'import json; json.load(open("report.sarif")); [json.loads(l) for l in open("report.jsonl")]'

  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/hexscope-core/fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Seed format corpora
        run: |
          mkdir -p fuzz/corpus/parse fuzz/corpus/parse_audio
          cp -R tests/corpus/. fuzz/corpus/parse/
          cp -R fuzz/seeds/parse_audio/. fuzz/corpus/parse/
          cp -R fuzz/seeds/parse_audio/. fuzz/corpus/parse_audio/
        working-directory: crates/hexscope-core
      - name: Fuzz smoke run
        # Real-format seeds exercise the dispatcher and focused parser targets.
        run: |
          cargo +nightly fuzz run parse -- -max_total_time=60
          cargo +nightly fuzz run parse_audio -- -max_total_time=30
          cargo +nightly fuzz run parse_eml -- -max_total_time=30
          cargo +nightly fuzz run copies -- -max_total_time=30 -rss_limit_mb=4096
        working-directory: crates/hexscope-core

  # Builds the static site. The output runs on any static host; deploying is
  # one extra step once a host is chosen. Until then the build is kept as a
  # downloadable artifact on every run.
  web:
    runs-on: ubuntu-26.04
    steps:
      # The whole history: each page's dates for search engines are its commits' (seo.ts).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install wasm-bindgen CLI (must match the pinned crate)
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (WASM, typecheck, bundle)
        run: pnpm build
      # What the page says about each sample — headline, verdict, tips, an
      # email's way — from the real parser, loaded as the worker loads it.
      - name: Web tests
        run: pnpm --filter web test
      # The page's own script, before any parser: what every visitor waits for —
      # the home page's script and the chunks it preloads, as index.html names
      # them. The analyzer that shows an open file is loaded once the page is
      # idle or a file is asked for, and has a budget of its own.
      - name: JavaScript size budget
        run: |
          cd apps/web/dist
          landing=0
          for f in $(grep -oE '(src|href)="\./assets/[^"]+\.js"' index.html | sed -E 's/.*"\.\/(assets\/[^"]+)"/\1/'); do
            landing=$((landing + $(gzip -9c "$f" | wc -c)))
          done
          analyzer=$(gzip -9c assets/analyzer-*.js | wc -c)
          echo "::notice::JavaScript: $landing bytes gzipped for the home page (budget 24000), $analyzer for the analyzer (budget 61000)."
          test "$landing" -le 24000
          test "$analyzer" -le 61000
      # An article is drawn once its stylesheet is here: the tokens, the top bar
      # and its own type (pages.css), not the app's — about a fifth of it.
      - name: Article stylesheet budget
        run: |
          cd apps/web/dist
          css=0
          for f in $(grep -oE 'href="\./assets/[^"]+\.css"' remove-metadata-from-photo.html | sed -E 's/.*"\.\/(assets\/[^"]+)"/\1/'); do
            css=$((css + $(gzip -9c "$f" | wc -c)))
          done
          echo "::notice::CSS: $css bytes gzipped for an article (budget 6000)."
          test "$css" -gt 0
          test "$css" -le 6000
      # Every visitor downloads a parser before seeing anything: the small one,
      # for pictures and movies, first; the whole one only for a document.
      # Their sizes are budgets, raised on purpose or not at all. The parser
      # is built per family of files, so a file loads only what reads it, and
      # a new format grows only its own family: pictures and movies alone;
      # with PDF; with Office, email and WebAssembly; or audio tags.
      # The optional roll/TIFF module is budgeted separately and is never an initial parser.
      # The documents' budget rose from 235000 for what Office on Windows leaves —
      # the folder, the template's path, the printer, SharePoint's properties,
      # editing-session numbers — found and taken out of clean copies.
      # The small one's rose from 140000 for SVG drawings (about 9 KB), read
      # there so a drawing, a text file or an unknown one never loads the
      # documents' build.
      # Then to 148000 for the names a file of no known format still holds
      # in its text — home folders, email addresses (strings.rs, ~2.4 KB).
      # All three fell when the sentence explaining each part, and its
      # citation, left the parser for files of their own (explain-*.js),
      # fetched once a file is open: 148000 → 140000, 228000 → 216000,
      # 239000 → 225000, each with room for a format or two.
      - name: WebAssembly size budget
        run: |
          size() { gzip -9c apps/web/dist/assets/"$1"_bg-*.wasm | wc -c; }
          media=$(size hexscope_media); pdf=$(size hexscope_pdf); docs=$(size hexscope_docs); audio=$(size hexscope_audio)
          echo "::notice::WebAssembly: $media bytes gzipped for pictures, movies and drawings (budget 140000), $pdf with PDF (budget 216000), $docs with Office, email and WebAssembly (budget 225000), $audio with MP3, FLAC and Ogg tags (budget 155000)."
          test "$media" -le 140000
          test "$pdf" -le 216000
          test "$docs" -le 225000
          test "$audio" -le 155000
          # What each part is, fetched after the answer: one file per build.
          for f in apps/web/dist/assets/explain-*.js; do
            n=$(gzip -9c "$f" | wc -c)
            echo "::notice::$(basename "$f"): $n bytes gzipped (budget 34000)."
            test "$n" -le 34000
          done
          raster=$(gzip -9c apps/web/dist/assets/hexscope_raster*.wasm | wc -c)
          echo "::notice::Optional roll/TIFF WebAssembly: $raster bytes gzipped (budget 215000)."
          test "$raster" -le 215000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hexscope-site
          path: apps/web/dist
          if-no-files-found: error

  # The built site in a real browser, on a computer's screen and a phone's: a
  # sample's answer, a clean copy, an email, offline. The very build that is
  # deployed, in four parts at once — one run took seven minutes.
  e2e:
    needs: web
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hexscope-site
          path: apps/web/dist
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: End-to-end tests, part ${{ matrix.shard }} of 4
        run: pnpm --filter web exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: apps/web/test-results
          if-no-files-found: ignore

  # Production from main, a preview URL for every other branch; never from a
  # pull request. Until the CLOUDFLARE_API_TOKEN secret exists (a token with
  # Account → Cloudflare Pages → Edit), the job says so and deploys nothing.
  deploy:
    needs: [test, web, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # An account id is not a credential: it names the account, the token
      # is what grants access to it.
      CLOUDFLARE_ACCOUNT_ID: 1b0f2bd63f1bc3ea8a7d401a7efa857b
    steps:
      # The site comes from the build; the visit counter's functions and the
      # database they are bound to (apps/web/wrangler.toml) from the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hexscope-site
          path: apps/web/dist
      # The sitemap as it was, so search engines hear only of the pages that changed.
      - name: Keep the sitemap before the deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: curl -fsS https://hexscope.org/sitemap.xml -o "$RUNNER_TEMP/sitemap-before.xml"
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/web
        run: >
          npx --yes wrangler@4 pages deploy dist --project-name hexscope
          --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
      # Search engines that take IndexNow hear of the new pages at once; one
      # that does not answer is no reason to call the deploy failed.
      - name: Tell search engines
        if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow.mjs apps/web/dist "$RUNNER_TEMP/sitemap-before.xml"
      - name: Nothing to deploy with
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
