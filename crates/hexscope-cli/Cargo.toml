[package]
name = "hexscope-cli"
version.workspace = true
description = "Checks files for what they give away — locations, serial numbers, authors, black boxes that hide nothing — and cleans or repairs them"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The files its tests check are for this repository, not for users of the crate.
exclude = ["tests/fixtures"]
keywords = ["file-inspection", "metadata", "privacy", "forensics", "redaction"]
categories = ["command-line-utilities"]

[[bin]]
name = "hexscope"
path = "src/main.rs"

[dependencies]
hexscope-core = { path = "../hexscope-core", version = "0.7.0" }
hexscope-raster = { path = "../hexscope-raster", version = "0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
