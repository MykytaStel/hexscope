[package]
name = "hexscope-core"
version.workspace = true
description = "Parses binary files into a structure tree with byte ranges"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["file-formats", "parsing", "metadata", "privacy", "forensics"]
categories = ["parser-implementations", "compression"]
# The test corpus and fixtures are for this repository's checks, not for users of the crate.
exclude = ["tests/corpus", "tests/fixtures", "tests/snapshots"]

[features]
default = ["documents"]
# PDF, Office and other ZIP archives, email and WebAssembly. Without it the
# dispatchers reach only pictures and movies — PNG, JPEG, HEIF, MP4 — and
# the linker leaves the rest out: the browser's small first module.
documents = []

[dependencies]
hexscope-inflate = { path = "../hexscope-inflate", version = "0.2.0" }

[dev-dependencies]
flate2 = "1"
insta = "1"
proptest = "1"

[dev-dependencies.criterion]
version = "0.5"

[[bench]]
name = "parse"
harness = false
