[package]
name = "hexscope-core"
version.workspace = true
description = "Parses binary files into a structure tree with byte ranges"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["file-formats", "parsing", "metadata", "privacy", "forensics"]
categories = ["parser-implementations", "compression"]
# The test corpus and fixtures are for this repository's checks, not for users of the crate.
exclude = ["tests/corpus", "tests/fixtures", "tests/snapshots"]

[features]
default = ["documents", "explain"]
# The sentence that says what each part of a file is (docs::Doc::text).
# The browser's builds leave it out and fetch the sentences when they are
# first shown: tens of kilobytes less in every visitor's first download.
explain = []
# PDF, Office and other ZIP archives, email and WebAssembly. Without them the
# dispatchers reach only pictures and movies — PNG, JPEG, HEIF, MP4 — and
# the linker leaves the rest out: the browser's small first module. Each is
# its own feature, so the browser can load a module per family of files.
documents = ["pdf", "office", "mail", "module", "svg", "strings"]
# PDF, its redaction, page texts and pictures.
pdf = []
# ZIP archives (Word, Excel, PowerPoint, iWork, EPUB, APK) and the Office 97
# and Outlook files kept in compound documents.
office = []
# Email saved as .eml.
mail = []
# WebAssembly modules.
module = []
# SVG drawings: in the browser, read by the small module with the pictures,
# so a drawing never loads the documents' one.
svg = []
# Names in the text of files no format reads: home folders, email addresses.
# In the browser, read by the small module, which such files load.
strings = []

[dependencies]
hexscope-inflate = { path = "../hexscope-inflate", version = "0.8.0" }

[dev-dependencies]
flate2 = "1"
insta = "1"
proptest = "1"

[dev-dependencies.criterion]
version = "0.8"

[[bench]]
name = "parse"
harness = false
