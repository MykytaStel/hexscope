[package]
name = "hexscope-wasm"
version.workspace = true
description = "WebAssembly bridge exposing hexscope-core to the browser"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# cdylib for the browser, rlib so the flattening logic is testable natively.
crate-type = ["cdylib", "rlib"]

[features]
# The browser's builds take neither: `explain` only for the native tests,
# which read the sentences the page fetches.
default = ["documents", "explain"]
explain = ["hexscope-core/explain"]
# Without them, the small module the page loads first: pictures and movies
# only. With one, pictures and movies and that family of files (see
# hexscope-core's features of the same names).
documents = ["pdf", "office", "mail", "module", "svg", "strings"]
pdf = ["hexscope-core/pdf"]
office = ["hexscope-core/office"]
mail = ["hexscope-core/mail"]
module = ["hexscope-core/module"]
svg = ["hexscope-core/svg"]
strings = ["hexscope-core/strings"]

[dependencies]
hexscope-core = { path = "../hexscope-core", default-features = false }
# Pinned exactly: the generated JS glue must match the wasm-bindgen CLI version.
wasm-bindgen = "=0.2.128"

[dev-dependencies]
flate2 = "1"
