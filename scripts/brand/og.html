<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* The link preview, in the site's graphite: rendered by scripts/make-brand-images.sh. */
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #090b0d; color: #f2f3f4;
         font: 16px/1.4 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
         display: grid; grid-template-columns: 600px 1fr; }
  .left { padding: 64px 0 60px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.01em; }
  .brand svg { width: 40px; height: 40px; }
  h1 { font-size: 64px; line-height: 1.02; letter-spacing: -0.035em; margin: 64px 0 24px; font-weight: 700; }
  p { font-size: 24px; line-height: 1.4; color: #9a9fa6; margin: 0; max-width: 480px; }
  .foot { margin-top: auto; display: flex; gap: 22px; font-size: 18px; color: #808890; }
  .foot span::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 10px 3px 0;
                       border-radius: 50%; background: #808890; }
  .right { padding: 56px 64px 56px 8px; display: flex; align-items: center; }
  .card { width: 100%; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: #0e1114; overflow: hidden; }
  .photo { position: relative; height: 250px; background: url("../../apps/web/public/samples/photo.jpg") center 58% / cover; }
  .pin { position: absolute; left: 22px; top: 22px; padding: 7px 14px; border-radius: 999px; font-size: 16px;
         color: #ff8b8b; background: rgba(20,10,12,.82); border: 1px solid rgba(255,107,107,.35); }
  .facts { padding: 18px 26px 22px; }
  .fact { display: grid; grid-template-columns: 170px 1fr; padding: 9px 0; font-size: 18px;
          border-top: 1px solid rgba(255,255,255,.07); }
  .fact:first-child { border-top: 0; }
  .fact i { font-style: normal; color: #9a9fa6; }
  .fact b { font: 500 18px "SF Mono", Menlo, monospace; color: #f2f3f4; }
  .fact.loc b { color: #ff8b8b; }
</style></head><body>
  <div class="left">
    <div class="brand"><svg viewBox="0 0 32 32"><path d="M16 2 28 9v14l-12 7-12-7V9z" fill="#f2f3f4"/><circle cx="16" cy="16" r="5" fill="#090b0d"/></svg>hexscope</div>
    <h1>See what your file reveals about you</h1>
    <p>Location, camera, author, hidden text — found in your browser, and removed in a clean copy.</p>
    <div class="foot"><span>Nothing is uploaded</span><span>Open source</span><span>hexscope.org</span></div>
  </div>
  <div class="right">
    <div class="card">
      <div class="photo"><div class="pin">● Contains location</div></div>
      <div class="facts">
        <div class="fact loc"><i>Location</i><b>48.8584° N, 2.2945° E</b></div>
        <div class="fact"><i>Camera serial</i><b>HX-000042</b></div>
        <div class="fact"><i>Owner</i><b>Sample Owner</b></div>
        <div class="fact"><i>Taken</i><b>2026-06-14 18:32</b></div>
      </div>
    </div>
  </div>
</body></html>
