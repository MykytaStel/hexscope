[workspace]
members = ["crates/hexscope-inflate", "crates/hexscope-core", "crates/hexscope-wasm", "crates/hexscope-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MykytaStel/hexscope"
homepage = "https://hexscope.pages.dev/"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The browser's build: optimised for size, what every visitor downloads
# first. "z" over "s" took the documents' build from 307 to 265 KB gzipped
# and the pictures' from 138 to 125, for parsing up to half as long again
# (a 5,000-page PDF, parsed and cleaned: 103 to 148 ms) — still a blink. The
# DEFLATE decoder, where a large PNG spends its time, is optimised for speed:
# for size it took half as long again (a 16 MB PNG: 467 to 715 ms). The
# command line keeps the release profile.
[profile.wasm]
inherits = "release"
opt-level = "z"

[profile.wasm.package.hexscope-inflate]
opt-level = 3
