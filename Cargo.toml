[workspace]
members = ["crates/hexscope-inflate", "crates/hexscope-core", "crates/hexscope-wasm", "crates/hexscope-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MykytaStel/hexscope"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The browser's build: optimised for size, 15% smaller gzipped (255 to
# 217 KB), except the DEFLATE decoder, where a large PNG spends its time:
# optimised for size it took half as long again (a 16 MB PNG: 467 to 715 ms).
# The command line keeps the release profile.
[profile.wasm]
inherits = "release"
opt-level = "s"

[profile.wasm.package.hexscope-inflate]
opt-level = 3
