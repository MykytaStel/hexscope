# Cloudflare Pages: the site in dist/, and the functions in functions/ that
# count visitors (server/count.ts). The database holds totals only, read by
# the account's owner alone: pnpm stats (scripts/stats.mjs).
name = "hexscope"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# The database of totals (migrations/0001_counts.sql); a new migration is
# applied with: npx wrangler@4 d1 migrations apply hexscope-counts --remote
[[d1_databases]]
binding = "COUNTS"
database_name = "hexscope-counts"
database_id = "c05fab72-aa26-4445-8408-ab61ff15b5f3"
